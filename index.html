<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Juan Saiz · Technical Artist</title>
    <meta name="description" content="Juan Saiz, Technical Artist & Pipeline Developer. One connected pipeline of tools in MaxScript, Python and C# across 3ds Max, Unity and Deadline." />
    <meta name="theme-color" content="#0b0c0f" />
    <!-- Modo día desactivado por ahora: la web queda fija en modo noche (data-theme="dark").
         Para reactivarlo: quitar data-theme de <html> y el atributo hidden de #theme-toggle;
         este script aplica entonces el modo guardado antes de pintar. -->
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (!document.documentElement.hasAttribute("data-theme") && (t === "light" || t === "dark"))
          document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <!-- Solo para quien tenga el enlace: que no aparezca en buscadores. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip" href="#stages">Skip to projects</a>

    <header class="topbar">
      <div class="wrap topbar-inner">
        <a href="#top" class="brand" id="brand">Juan Saiz</a>
        <nav id="stage-nav" class="stage-nav" aria-label="Pipeline stages"></nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode" hidden>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" /></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z" /></svg>
        </button>
        <a href="#contact" class="topbar-cta">Contact</a>
      </div>
    </header>

    <main>
      <section id="top" class="hero">
        <div class="wrap">
          <p class="eyebrow" id="hero-kicker"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-text" id="hero-text"></p>
          <a class="btn hero-cta" href="#contact">Get in touch</a>
        </div>

        <div class="wrap">
          <ol class="pipeline" id="pipeline" aria-label="Pipeline overview"></ol>
        </div>

        <div class="wrap">
          <ul class="impact" id="impact" aria-label="Impact"></ul>
        </div>
      </section>

      <div id="stages"></div>

      <section id="about" class="about">
        <div class="wrap about-inner">
          <p class="eyebrow">About</p>
          <h2>I started as a 3D artist.</h2>
          <p id="about-text" class="about-text"></p>
        </div>
      </section>

      <section id="contact" class="contact" aria-labelledby="contact-title">
        <div class="wrap contact-inner">
          <h2 id="contact-title" class="contact-title"></h2>
          <!-- Clic en el email o en Copy: se copia al portapapeles (mucha gente no usa app de correo). -->
          <div class="email-row">
            <button type="button" class="email" id="email" aria-describedby="copy-status"></button>
            <button type="button" class="copy-btn" id="copy-btn">Copy</button>
          </div>
          <div id="contact-links" class="contact-links"></div>
          <p id="copy-status" class="sr-only" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap"><span id="footer-name"></span> · © <span id="year"></span></div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
